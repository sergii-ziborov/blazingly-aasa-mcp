name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # No test reaches the network, so CI is not at the mercy of someone else's DNS.
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # A workflow that does not parse is registered by path, reports no triggers, and never runs.
      - name: Workflow files parse and declare triggers
        if: matrix.os == 'ubuntu-latest'
        run: pip install --quiet pyyaml && python3 scripts/check_workflows.py
      # The README quotes this output verbatim; offline commands only, so it runs anywhere.
      - name: CLI prints what the README says it prints
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/check_examples.sh
      - name: Documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 1.85, not the library's 1.78: the rustls stack reaches zeroize 1.9, which is edition 2024.
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --bins

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: The binary answers an MCP handshake
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./target/release/blazingly-aasa > /tmp/out.jsonl
          grep -q '"name":"blazingly-aasa"' /tmp/out.jsonl
          grep -q 'check_universal_link' /tmp/out.jsonl
          test "$(wc -l < /tmp/out.jsonl)" -eq 2
